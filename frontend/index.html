<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helmcentral Dashboard</title>

    <!--
      Installable web app. iOS grants the Push API only to a site added to the
      Home Screen, so these are what make alarm push possible on a phone at all
      (docs/adr/0045). iOS ignores the manifest's icons and reads
      apple-touch-icon, which must be a PNG — an SVG or a missing file gives a
      screenshot of the page as the Home Screen icon.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Helmcentral" />
    <meta name="theme-color" content="#FFFFFF" />
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
    <!--
      Boot-error reporter (ADR 0089). A kiosk has no keyboard and no devtools,
      and a module that fails to parse leaves a white screen with nothing to
      read. This classic script runs even when the module below cannot, and
      posts the first error or unhandled rejection of the page load to the
      backend log through the kiosk probe endpoint. ES5 on purpose.
    -->
    <script>
      (function () {
        var sent = false;
        function report(detail) {
          if (sent) return;
          sent = true;
          try {
            var body = JSON.stringify({
              user_agent: navigator.userAgent,
              viewport: { w: window.innerWidth, h: window.innerHeight },
              rotate: 0,
              checks: [{ name: 'boot error', pass: false, detail: String(detail).slice(0, 500) }]
            });
            if (window.fetch) {
              fetch('/api/kiosk-probe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true })['catch'](function () {});
            } else if (window.XMLHttpRequest) {
              var xhr = new XMLHttpRequest();
              xhr.open('POST', '/api/kiosk-probe', true);
              xhr.setRequestHeader('Content-Type', 'application/json');
              xhr.send(body);
            }
          } catch (e) {}
        }
        window.addEventListener('error', function (ev) {
          var where = (ev.filename || '?') + ':' + (ev.lineno || 0);
          report((ev.message || 'error') + ' at ' + where);
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev.reason;
          report('unhandled rejection: ' + (r && r.message ? r.message : String(r)));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
