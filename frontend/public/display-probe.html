<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kiosk device probe</title>
<style>
  /* Deliberately plain: this page exists to tell us what the device's
     browser actually supports before any app code runs on it, so it must
     not depend on anything the probe itself is checking for (no :has(),
     no structuredClone, nothing from the build).

     Laid out as a fixed 10x2 grid so the whole report fits inside a
     1920x360 wall strip with no scrolling - the device has no keyboard or
     mouse to scroll with. Sized for the worst case (all checks, the
     3-wide key readout, and the rotated helmcam cell); widen this if more
     checks are added. The full
     detail of each check still goes to the backend log (POST
     /api/display-probe); the on-screen grid only needs to be glanceable, not
     exhaustive. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0b;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    display: flex;
    flex-direction: column;
  }
  body.rotate-180 {
    transform: rotate(180deg);
    transform-origin: center center;
  }
  #header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 34px;
    padding: 6px 16px;
    border-bottom: 1px solid #333;
  }
  #title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9aa0a6;
    white-space: nowrap;
  }
  #ua {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 12px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #report-status {
    flex: 0 0 auto;
    font-size: 12px;
    color: #f1c40f;
    white-space: nowrap;
  }
  #grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    padding: 8px;
  }
  .cell {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 12px 16px;
    border: 1px solid #333;
    border-radius: 4px;
  }
  .cell .name {
    font-size: 18px;
    color: #d0d0d0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cell .badge {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.1;
  }
  .cell .detail {
    font-size: 14px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pass { color: #2ecc71; }
  .fail { color: #e74c3c; }
  .info { color: #f1c40f; }
  /* The key readout is the one cell an operator reads on the screen
     itself rather than out of the backend log: you press a button on the
     remote and look up. Three columns wide so a full key/code/keyCode
     triple fits without ellipsis. */
  .cell.keys {
    grid-column: span 3;
    justify-content: flex-start;
  }
  .cell.keys .keylist {
    margin-top: 2px;
    font-size: 15px;
    line-height: 1.35;
    color: #d0d0d0;
    white-space: pre;
    overflow: hidden;
  }
  .cell.keys .keylist .waiting { color: #888; }
  .cell.helmcam {
    padding: 0;
  }
  .cell.helmcam iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }
</style>
</head>
<body>
<div id="header">
  <span id="title">Kiosk probe</span>
  <span id="ua"></span>
  <span id="report-status">not reported yet</span>
</div>
<div id="grid"></div>
<script>
(function () {
  // Checks 1-8 are Phase 0's device checks (plan: delightful-drifting-
  // anchor); check 9 ("Report POST") is new - it reflects whether the most
  // recent POST to /api/display-probe itself succeeded, since the operator
  // now reads results from the backend log rather than this screen. Check
  // 9's status necessarily lags one report cycle behind: its own outcome
  // isn't known until after it has been sent, so each report includes the
  // previous attempt's result and updates it once the current attempt
  // resolves.
  var params = new URLSearchParams(location.search);
  var rotated = params.get('rotate') === '180';
  if (rotated) document.body.classList.add('rotate-180');

  // Mirrors /kiosk's own ?height=<px> option (ADR 0089): a kiosk browser can
  // report a viewport taller than the panel it actually drives, so this
  // constrains the probe's own root box to the panel's real height at the
  // top of the viewport instead of the full (oversized) one, the same
  // 200-4320 integer range lib/kiosk.ts's parseKioskOptions accepts. Kept
  // null (full viewport, unchanged behaviour) for anything else.
  var rawHeight = params.get('height');
  var parsedHeight = rawHeight === null ? NaN : Number(rawHeight);
  var height = (Number.isInteger(parsedHeight) && parsedHeight >= 200 && parsedHeight <= 4320) ? parsedHeight : null;
  if (height !== null) {
    document.body.style.position = 'fixed';
    document.body.style.top = '0';
    document.body.style.left = '0';
    document.body.style.width = '100vw';
    document.body.style.height = height + 'px';
    document.body.style.overflow = 'hidden';
  }

  var grid = document.getElementById('grid');
  var checks = [];

  // display is the on-screen badge style ('pass' | 'fail' | 'info'),
  // independent of the boolean `pass` sent to the backend - used for the
  // 100svh check below, which is informational and must never fail the
  // grid even though CSS.supports can return false for it.
  function addCheck(name, pass, detail, display) {
    checks.push({ name: name, pass: pass, detail: detail || '', display: display || (pass ? 'pass' : 'fail') });
  }

  // 1. WebGL2 + renderer string. A software renderer (SwiftShader, llvmpipe)
  // counts as a fail for the map pages even though the context itself opens.
  (function checkWebGL2() {
    var canvas = document.createElement('canvas');
    var gl = null;
    try {
      gl = canvas.getContext('webgl2');
    } catch (e) {
      gl = null;
    }
    if (!gl) {
      addCheck('WebGL2 context', false, 'no webgl2 context');
      return;
    }
    var renderer = 'unknown';
    var ext = gl.getExtension('WEBGL_debug_renderer_info');
    if (ext) {
      renderer = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
    } else {
      renderer = gl.getParameter(gl.RENDERER);
    }
    var isSoftware = /swiftshader|llvmpipe|software/i.test(String(renderer));
    addCheck('WebGL2 context', !isSoftware, (isSoftware ? 'software: ' : 'hw: ') + renderer);
  })();

  // 2. :has() selector support.
  (function checkHas() {
    var ok = false;
    try {
      ok = CSS.supports('selector(:has(*))');
    } catch (e) {
      ok = false;
    }
    addCheck(':has() selector', ok, 'CSS.supports(:has())');
  })();

  // 3. 100svh support. Informational only: the kiosk root uses fixed
  // inset-0, not svh, so this does not gate the decision either way -
  // always reported pass:true to the backend, with the real support state
  // in the detail; shown on screen with the distinct amber "info" badge.
  (function checkSvh() {
    var ok = false;
    try {
      ok = CSS.supports('height: 100svh');
    } catch (e) {
      ok = false;
    }
    addCheck('100svh unit', true, 'not used, fixed inset-0 (supported: ' + ok + ')', 'info');
  })();

  // 4. structuredClone.
  (function checkStructuredClone() {
    var ok = typeof structuredClone === 'function';
    addCheck('structuredClone', ok, "typeof === 'function'");
  })();

  // 4b. Regex lookbehind. Safari gained it in 16.4; a lookbehind literal in
  // the app's entry chunk is a parse-time SyntaxError on anything older, so
  // this is the check that would have named the 2026-09-12 white screen.
  (function checkLookbehind() {
    var lbOk = true, lbDetail = 'parses (?<=a)b';
    try { new RegExp('(?<=a)b'); } catch (e) { lbOk = false; lbDetail = String(e && e.message || e).slice(0, 80); }
    addCheck('regex lookbehind', lbOk, lbDetail);
  })();

  // 5. EventSource, ResizeObserver, matchMedia, Intl timezone.
  (function checkMisc() {
    addCheck('EventSource', typeof EventSource === 'function', 'telemetry stream (ADR 0037)');
    addCheck('ResizeObserver', typeof ResizeObserver === 'function', 'tile scaling');
    addCheck('matchMedia', typeof matchMedia === 'function', 'breakpoint/theme detection');

    var tz = null;
    var hasTz = false;
    try {
      tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      hasTz = typeof tz === 'string' && tz.length > 0;
    } catch (e) {
      hasTz = false;
    }
    addCheck('Intl timezone', hasTz, hasTz ? tz : 'resolution failed');
  })();

  // 5b-5d. Tailwind v4's CSS needs a Safari 16.4 floor: cascade layers
  // (@layer), registered custom properties (@property) and color-mix() are
  // all required for its generated output to work as intended, so each
  // gets its own check here rather than being inferred from something else.

  // 5b. @layer (cascade layers). Tailwind v4 emits its base/components/
  // utilities split as @layer rules. CSS.supports can't test an at-rule, so
  // this probes behaviourally: `@layer a, b;` declares layer a before layer
  // b, which makes b the higher-priority layer - then each layer's rule
  // block (each targeting the same hidden test element) is written in the
  // opposite order, b's block first and a's block second, so the test only
  // passes if the browser is going by declared layer order and not by
  // where each block happens to sit in the source. b's width (1px) should
  // win. An unsupported browser drops the layered rules entirely, leaving
  // the element's width at its unstyled default instead of 1px.
  (function checkCascadeLayers() {
    var ok = false;
    var detail = 'width mismatch';
    var style = document.createElement('style');
    style.textContent = '@layer a, b; @layer b { #probe-layer { width: 1px } } @layer a { #probe-layer { width: 2px } }';
    var el = document.createElement('div');
    el.id = 'probe-layer';
    el.style.position = 'absolute';
    el.style.visibility = 'hidden';
    document.head.appendChild(style);
    document.body.appendChild(el);
    try {
      var width = getComputedStyle(el).width;
      ok = width === '1px';
      detail = "computed width '" + width + "' (want '1px': layer b is declared after a in '@layer a, b;', so b should win)";
    } catch (e) {
      ok = false;
      detail = String(e && e.message || e).slice(0, 80);
    } finally {
      document.head.removeChild(style);
      document.body.removeChild(el);
    }
    addCheck('css @layer', ok, detail);
  })();

  // 5c. @property (registered custom properties). Tailwind v4 uses @property
  // to give its generated custom properties a type and an initial value.
  // typeof CSS.registerProperty is the JS-side signal, but the app cares
  // about the at-rule form Tailwind actually emits, so this probes that
  // directly: an @property rule types --probe-x as a <length> with a 3px
  // initial value, then checks that value comes back from the cascade.
  (function checkAtProperty() {
    var ok = false;
    var detail = 'initial-value not applied';
    var style = document.createElement('style');
    style.textContent = "@property --probe-x { syntax: '<length>'; inherits: false; initial-value: 3px }";
    var el = document.createElement('div');
    el.style.position = 'absolute';
    el.style.visibility = 'hidden';
    document.head.appendChild(style);
    document.body.appendChild(el);
    try {
      var value = getComputedStyle(el).getPropertyValue('--probe-x').trim();
      ok = value === '3px';
      var jsSignal = typeof CSS !== 'undefined' && typeof CSS.registerProperty === 'function';
      detail = ok ? 'initial-value applied (3px)' : "got '" + value + "', want '3px' (CSS.registerProperty: " + jsSignal + ')';
    } catch (e) {
      ok = false;
      detail = String(e && e.message || e).slice(0, 80);
    } finally {
      document.head.removeChild(style);
      document.body.removeChild(el);
    }
    addCheck('css @property', ok, detail);
  })();

  // 5d. color-mix(). Tailwind v4's opacity utilities (e.g. bg-black/50)
  // compile to color-mix(), unlike v3's plain rgba(). CSS.supports can test
  // this one directly since it's a value, not an at-rule.
  (function checkColorMix() {
    var ok = false;
    try {
      ok = CSS.supports('color', 'color-mix(in oklab, red, blue)');
    } catch (e) {
      ok = false;
    }
    addCheck('css color-mix()', ok, "CSS.supports('color', 'color-mix(in oklab, red, blue)')");
  })();

  // 5e. Screen Wake Lock. Asynchronous: presence of the API is not the
  // question, whether an actual request('screen') is granted is, and a
  // browser can expose navigator.wakeLock and still refuse. Seeded pending
  // and updated when the request settles, the same shape reportCheck uses.
  // Note this cannot defeat a television's own auto-power-off or energy
  // saving; those are menu settings on the set, not things a page can hold
  // off. See the wall-display how-to.
  var wakeLockCheck = { name: 'wake lock', pass: false, detail: 'pending', display: 'info' };
  (function checkWakeLock() {
    if (typeof navigator === 'undefined' || !navigator.wakeLock || typeof navigator.wakeLock.request !== 'function') {
      wakeLockCheck.pass = false;
      wakeLockCheck.display = 'fail';
      wakeLockCheck.detail = 'navigator.wakeLock absent';
      return;
    }
    try {
      navigator.wakeLock.request('screen').then(function (sentinel) {
        wakeLockCheck.pass = true;
        wakeLockCheck.display = 'pass';
        wakeLockCheck.detail = 'granted, held';
        // Keep it held for the life of the probe: releasing immediately
        // would not tell us whether the set actually stays awake, which is
        // the thing worth learning by leaving this page up.
        if (sentinel && typeof sentinel.addEventListener === 'function') {
          sentinel.addEventListener('release', function () {
            wakeLockCheck.detail = 'granted, then released by the browser';
            wakeLockCheck.display = 'info';
          });
        }
        renderGrid();
      }).catch(function (err) {
        wakeLockCheck.pass = false;
        wakeLockCheck.display = 'fail';
        wakeLockCheck.detail = 'refused: ' + truncate(err && err.name ? err.name : err, 40);
        renderGrid();
      });
    } catch (e) {
      wakeLockCheck.pass = false;
      wakeLockCheck.display = 'fail';
      wakeLockCheck.detail = String(e && e.message || e).slice(0, 60);
    }
  })();

  // 5f. transform: scale() without a layout change. A display's scale
  // factor is applied as a CSS transform rather than as zoom precisely
  // because react-grid-layout measures its container's LAYOUT width to
  // decide column widths, and a transform must leave that alone. So this
  // checks both halves: that the painted box really is 1.5x (bounding
  // rect), and that the laid-out box is not (offsetWidth unchanged). A
  // browser that failed the second half would lay the grid out against an
  // already-scaled width and then scale it again.
  (function checkTransformScale() {
    var supported = false;
    try { supported = CSS.supports('transform', 'scale(1.5)'); } catch (e) { supported = false; }

    var host = document.createElement('div');
    host.style.position = 'absolute';
    host.style.visibility = 'hidden';
    host.style.left = '0';
    host.style.top = '0';
    host.style.width = '200px';
    var inner = document.createElement('div');
    inner.style.width = '200px';
    inner.style.height = '20px';
    inner.style.transformOrigin = 'top left';
    inner.style.transform = 'scale(1.5)';
    host.appendChild(inner);
    document.body.appendChild(host);

    var painted = 0, laidOut = 0, ok = false, detail = '';
    try {
      painted = Math.round(inner.getBoundingClientRect().width);
      laidOut = inner.offsetWidth;
      ok = supported && painted === 300 && laidOut === 200;
      detail = 'painted ' + painted + 'px (want 300), layout ' + laidOut + 'px (want 200)';
    } catch (e) {
      ok = false;
      detail = String(e && e.message || e).slice(0, 60);
    } finally {
      document.body.removeChild(host);
    }
    addCheck('transform scale', ok, detail);
  })();

  // 5g. What the browser thinks its viewport is, against what the panel
  // actually is. Informational, because only the operator standing in front
  // of the set can say whether these numbers match the panel: a browser
  // reporting 1920x1080 on a 1920x360 strip is the known ODROID case, and a
  // television reporting 1280x720 CSS px on a 4K panel is the case this
  // line exists to catch before a display record is created with the wrong
  // canvas in it. These are the numbers to enter as the display's size.
  (function checkViewport() {
    var probe = document.createElement('div');
    probe.style.position = 'fixed';
    probe.style.visibility = 'hidden';
    probe.style.left = '0';
    probe.style.top = '0';
    probe.style.width = '100vw';
    probe.style.height = '1px';
    document.body.appendChild(probe);
    var vw = 0;
    try { vw = Math.round(probe.getBoundingClientRect().width); } finally { document.body.removeChild(probe); }

    var dpr = (typeof devicePixelRatio === 'number') ? devicePixelRatio : 1;
    var scr = (typeof screen !== 'undefined' && screen) ? (screen.width + 'x' + screen.height) : 'unknown';
    addCheck(
      'viewport',
      true,
      'inner ' + window.innerWidth + 'x' + window.innerHeight + ', 100vw=' + vw + ', screen ' + scr + ', dpr ' + dpr,
      'info'
    );
  })();

  // 5h. Live key readout. What an LG Magic Remote (or any other remote)
  // actually emits is not knowable off the device, and the wall display's
  // step/pause keys have to be written against real codes rather than an
  // assumed table. This cell updates in place on every press: renderGrid
  // re-appends this same node rather than building a new one, so pressing a
  // key never rebuilds the helmcam iframe and never restarts its stream.
  var keyEvents = [];
  var keysCell = document.createElement('div');
  keysCell.className = 'cell keys';
  (function buildKeysCell() {
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = 'keys (last 4)';
    var list = document.createElement('div');
    list.className = 'keylist';
    var waiting = document.createElement('span');
    waiting.className = 'waiting';
    waiting.textContent = 'press a remote or keyboard key';
    list.appendChild(waiting);
    keysCell.appendChild(name);
    keysCell.appendChild(list);

    window.addEventListener('keydown', function (e) {
      keyEvents.unshift({
        key: String(e.key),
        code: String(e.code),
        keyCode: e.keyCode,
        at: nowHHMMSS()
      });
      if (keyEvents.length > 4) keyEvents.length = 4;
      list.textContent = keyEvents.map(function (k) {
        return k.at + '  key=' + k.key + '  code=' + k.code + '  keyCode=' + k.keyCode;
      }).join('\n');
    });
  })();

  // 9. Whether the last report POST succeeded. Seeded as pending until the
  // first report() call resolves.
  var reportCheck = { name: 'Report POST', pass: false, detail: 'pending', display: 'info' };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function nowHHMMSS() {
    var d = new Date();
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }
  function truncate(str, max) {
    str = String(str == null ? '' : str);
    return str.length > max ? str.slice(0, max - 1) + '…' : str;
  }

  function setReportStatus(text) {
    document.getElementById('report-status').textContent = text;
  }

  function renderGrid() {
    grid.innerHTML = '';
    checks.concat([wakeLockCheck, reportCheck]).forEach(function (chk) {
      var cell = document.createElement('div');
      cell.className = 'cell';

      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = chk.name;

      var badge = document.createElement('div');
      badge.className = 'badge ' + chk.display;
      badge.textContent = chk.display === 'pass' ? 'PASS' : chk.display === 'fail' ? 'FAIL' : 'INFO';

      var detail = document.createElement('div');
      detail.className = 'detail';
      detail.textContent = chk.detail;

      cell.appendChild(name);
      cell.appendChild(badge);
      cell.appendChild(detail);
      grid.appendChild(cell);
    });

    // Re-appended, not rebuilt: keysCell holds live state (and its own
    // keydown listener) that must survive a re-render.
    grid.appendChild(keysCell);

    // 6. Rotation + helmcam embed, only when ?rotate=180 is present - sized
    // as one grid cell (not full width) so every check stays visible
    // alongside it. The manual part (stop helmcam for 60s, confirm frames
    // resume without a reload) is done by eye against this iframe.
    if (rotated) {
      var camCell = document.createElement('div');
      camCell.className = 'cell helmcam';
      var iframe = document.createElement('iframe');
      iframe.src = 'http://192.168.50.170:8090/';
      iframe.title = 'helmcam';
      camCell.appendChild(iframe);
      grid.appendChild(camCell);
    }
  }

  function report() {
    var payload = {
      user_agent: navigator.userAgent,
      viewport: { w: window.innerWidth, h: window.innerHeight },
      rotate: rotated ? 180 : 0,
      checks: checks.concat([wakeLockCheck, reportCheck]).map(function (c) {
        return { name: c.name, pass: c.pass, detail: c.detail };
      }),
      keys: keyEvents.slice()
    };
    if (height !== null) payload.height = height;

    fetch('/api/display-probe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (resp) {
      if (resp.ok) {
        reportCheck.pass = true;
        reportCheck.display = 'pass';
        reportCheck.detail = 'HTTP ' + resp.status;
        setReportStatus('reported ' + nowHHMMSS());
        return;
      }
      return resp.text().then(function (text) {
        reportCheck.pass = false;
        reportCheck.display = 'fail';
        reportCheck.detail = 'HTTP ' + resp.status;
        setReportStatus('HTTP ' + resp.status + (text ? ': ' + truncate(text, 60) : ''));
      });
    }).catch(function (err) {
      reportCheck.pass = false;
      reportCheck.display = 'fail';
      reportCheck.detail = 'network error';
      setReportStatus('network error: ' + truncate(err && err.message ? err.message : err, 60));
    }).then(function () {
      renderGrid();
    });
  }

  document.getElementById('ua').textContent = navigator.userAgent;
  renderGrid();
  report();
  setInterval(report, 60000);
})();
</script>
</body>
</html>
