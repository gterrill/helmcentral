<!--
  Helmcentral's mark: lucide's Anchor (ISC), the same icon the login screen
  renders, in the app's own --primary on --background so the favicon matches the
  shipped theme. The PNG sizes the manifest needs are rasterised from this same
  geometry.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect width="24" height="24" fill="#FAFAFA"/>
  <g transform="translate(12 12) scale(0.62) translate(-12 -12)"
     fill="none" stroke="#3D5CC2" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22V8"/>
    <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
    <circle cx="12" cy="5" r="3"/>
  </g>
</svg>
