services:
  backend:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      tide-plugins-builder:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - SETTINGS_FILE=/app/settings.yaml
    volumes:
      - ./settings.yaml:/app/settings.yaml

  frontend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "5173:5173"

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      tide-plugins-builder:
        condition: service_completed_successfully
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      - SETTINGS_FILE=/app/settings.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./settings.yaml:/app/settings.yaml
      - ./plugins:/app/plugins
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=300
      - VITE_API_PROXY_TARGET=http://host.docker.internal:8080
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules

  # One-shot builder: compiles the bundled reference tide plugins (bom, noaa)
  # from docs/examples/tide-plugins/ with TinyGo and drops the resulting
  # <name>.wasm + <name>.allowed_hosts.json pair into ./plugins/tides, the
  # same host directory bind-mounted into backend/backend-dev above. No
  # `profiles:` key here on purpose: a profile-less service is always part
  # of the resolved graph, so it's pulled in as a dependency whether the
  # "prod" or "dev" profile is activated, without needing to be listed under
  # both. Pinned to 0.41.1 (not :latest) to match this repo's other TinyGo
  # WASM fixtures and avoid version drift.
  tide-plugins-builder:
    image: tinygo/tinygo:0.41.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e &&
        cd /src/bom && go mod download && tinygo build -o /out/bom.wasm -target wasip1 -buildmode c-shared . && cp bom.allowed_hosts.json /out/bom.allowed_hosts.json &&
        cd /src/noaa && go mod download && tinygo build -o /out/noaa.wasm -target wasip1 -buildmode c-shared . && cp noaa.allowed_hosts.json /out/noaa.allowed_hosts.json
    volumes:
      - ./docs/examples/tide-plugins:/src:ro
      - ./plugins/tides:/out

volumes:
  frontend_node_modules:

