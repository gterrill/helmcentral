services:
  backend:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      plugins-builder:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - SETTINGS_FILE=/app/settings.yaml
    volumes:
      - ./settings.yaml:/app/settings.yaml

  frontend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "5173:5173"

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      plugins-builder:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      - SETTINGS_FILE=/app/settings.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./settings.yaml:/app/settings.yaml
      - ./plugins:/app/plugins
      # air recompiles on every save, so the Go build and module caches grow
      # continuously. Left unmounted they land in the container's writable
      # layer (measured at 1.46GB: ~754MB build + ~749MB modules) and are
      # thrown away and re-accumulated on every image rebuild. Named volumes
      # keep them outside the layer and let them survive a rebuild.
      - backend_go_build_cache:/root/.cache/go-build
      - backend_go_mod_cache:/go/pkg/mod
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    # No CHOKIDAR_USEPOLLING/CHOKIDAR_INTERVAL here on purpose — see the watch
    # comment in frontend/vite.config.ts. Native FSEvents-backed inotify over
    # VirtioFS works, so the 300ms stat-poll over the whole ~32k-file /workspace
    # mount was removed after HMR was verified without it.
    environment:
      - VITE_API_PROXY_TARGET=http://host.docker.internal:8080
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules

  # E2E stack: a second, throwaway instance for browser-driven verification
  # (Playwright et al). It exists because those scripts drive the real UI —
  # including Save buttons — and the "dev" stack above bind-mounts the
  # developer's live settings.yaml and writes its runtime state straight into
  # ./backend. Filling in a form field to test a dirty-state indicator must
  # not be able to repoint the running dashboard's SignalK server.
  #
  # Isolation comes from two things:
  #   - HELMCENTRAL_STATE_DIR + SETTINGS_FILE redirect every write into the
  #     e2e_state volume (see cacheFilePath in backend/weather_tide.go)
  #   - ./settings.yaml is deliberately NOT mounted here
  # ./backend is still mounted so air hot-reloads, but the backend's cwd is no
  # longer where its state lands.
  backend-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      plugins-builder:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      - HELMCENTRAL_STATE_DIR=/state
      - SETTINGS_FILE=/state/settings.yaml
    # Re-seeds on every container start, so `make e2e-reset` (or any restart)
    # returns the stack to a known state regardless of what the last run
    # clicked. air restarts the binary, not the container, so an in-progress
    # session keeps whatever it saved.
    command:
      - /bin/sh
      - -c
      - >
        mkdir -p /state/data /state/cache &&
        cp -f /seed/settings.seed.yaml /state/settings.yaml &&
        exec /go/bin/air -c /app/.air.toml
    ports:
      - "8090:8080"
    volumes:
      - ./backend:/app
      - ./plugins:/app/plugins
      - ./e2e/settings.seed.yaml:/seed/settings.seed.yaml:ro
      - e2e_state:/state
      # Same rationale as backend-dev above. Its own volumes, not shared with
      # backend-dev: two air instances compiling into one cache would race.
      - e2e_go_build_cache:/root/.cache/go-build
      - e2e_go_mod_cache:/go/pkg/mod
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend-e2e:
    profiles: ["e2e"]
    image: node:20-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=300
      - VITE_API_PROXY_TARGET=http://host.docker.internal:8090
      # Required, not belt-and-braces. Several hooks — including
      # use-settings-form.ts, the sole caller of POST /api/settings — do not
      # use the Vite proxy at all; they build an absolute URL defaulting to
      # `<host>:8080`, which is the *dev* backend and the real settings.yaml.
      # Without this override, clicking Save on :5174 writes to the live
      # config, i.e. exactly the incident this stack exists to prevent.
      # localhost is correct here: the browser runs on the host, not in the
      # container.
      - VITE_API_BASE_URL=http://localhost:8090
    ports:
      - "5174:5174"
    volumes:
      - ./:/workspace
      # Its own volume, not frontend_node_modules: two containers running
      # `npm install` against one volume race and corrupt it.
      - e2e_node_modules:/workspace/frontend/node_modules

  # One-shot builder: compiles the bundled reference tide, weather, wave and
  # forecast-warnings plugins (bom/noaa, open-meteo/weatherkit,
  # open-meteo-marine, bom/nws) from
  # docs/examples/{tide,weather,wave,forecast-warnings}-plugins/ with TinyGo
  # and drops each <name>.wasm + <name>.allowed_hosts.json (+
  # <name>.config.json, for weatherkit) into
  # ./plugins/{tides,weather,waves,forecast-warnings}, the same host
  # directory bind-mounted into backend/backend-dev above. No `profiles:`
  # key here on purpose: a profile-less service is always part of the
  # resolved graph, so it's pulled in as a dependency whether the "prod" or
  # "dev" profile is activated, without needing to be listed under both.
  # Pinned to 0.41.1 (not :latest) to match this repo's other TinyGo WASM
  # fixtures and avoid version drift.
  plugins-builder:
    image: tinygo/tinygo:0.41.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e &&
        mkdir -p /out/tides /out/weather /out/waves /out/forecast-warnings &&
        cd /src/tide-plugins/bom && go mod download && tinygo build -o /out/tides/bom.wasm -target wasip1 -buildmode c-shared . && cp bom.allowed_hosts.json /out/tides/bom.allowed_hosts.json &&
        cd /src/tide-plugins/noaa && go mod download && tinygo build -o /out/tides/noaa.wasm -target wasip1 -buildmode c-shared . && cp noaa.allowed_hosts.json /out/tides/noaa.allowed_hosts.json &&
        cd /src/weather-plugins/open-meteo && go mod download && tinygo build -o /out/weather/open-meteo.wasm -target wasip1 -buildmode c-shared . && cp open-meteo.allowed_hosts.json /out/weather/open-meteo.allowed_hosts.json &&
        cd /src/weather-plugins/weatherkit && go mod download && tinygo build -o /out/weather/weatherkit.wasm -target wasip1 -buildmode c-shared . && cp weatherkit.allowed_hosts.json /out/weather/weatherkit.allowed_hosts.json && cp weatherkit.config.json /out/weather/weatherkit.config.json && cp weatherkit.allowed_secrets.json /out/weather/weatherkit.allowed_secrets.json &&
        cd /src/wave-plugins/open-meteo-marine && go mod download && tinygo build -o /out/waves/open-meteo-marine.wasm -target wasip1 -buildmode c-shared . && cp open-meteo-marine.allowed_hosts.json /out/waves/open-meteo-marine.allowed_hosts.json &&
        cd /src/forecast-warnings-plugins/bom && go mod download && tinygo build -o /out/forecast-warnings/bom.wasm -target wasip1 -buildmode c-shared . && cp bom.allowed_hosts.json /out/forecast-warnings/bom.allowed_hosts.json &&
        cd /src/forecast-warnings-plugins/nws && go mod download && tinygo build -o /out/forecast-warnings/nws.wasm -target wasip1 -buildmode c-shared . && cp nws.allowed_hosts.json /out/forecast-warnings/nws.allowed_hosts.json
    volumes:
      - ./docs/examples:/src:ro
      - ./plugins:/out

volumes:
  frontend_node_modules:
  e2e_node_modules:
  e2e_state:
  backend_go_build_cache:
  backend_go_mod_cache:
  e2e_go_build_cache:
  e2e_go_mod_cache:

