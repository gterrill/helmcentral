# Helmcentral settings.
#
# Nothing here is required to start: a missing or empty file is tolerated, and
# the Settings UI writes this file back on save. On first run Helmcentral
# sweeps the local network for a SignalK server and offers what it finds, so
# the usual path is to start the service and configure it in the browser
# rather than to edit this file by hand.
#
# Secrets (SignalK credentials, InfluxDB token, WeatherKit keys) are NOT kept
# here — they live in an encrypted store managed from Settings. See
# docs/reference/configuration.md.

signalk:
  # Hostname or IP of your SignalK server. `localhost` is correct when
  # Helmcentral runs on the same machine as SignalK.
  address: localhost
  port: 3000

auth:
  # Normally set from Settings -> Security rather than here. Editing this file
  # is the recovery path if you are locked out.
  #
  # none    — no authentication (default). Anyone on the network this server
  #           is reachable from can read and control everything the API
  #           exposes. Fine for a trusted boat LAN; never expose past it.
  # signalk — require login via your SignalK server's own accounts before
  #           serving anything but the login screen. SignalK's own security
  #           must already be enabled; the Settings save is refused if it is
  #           not, and startup refuses too. See
  #           docs/adr/0040-signalk-delegated-authentication.md.
  mode: none

boat:
  vessel_prefix: M/V
  model: My Boat
  house_battery_capacity_ah: 600

# metric | imperial
units: metric

anchor:
  bow_roller_height_m: 1.5
  gps_from_bow_m: 0        # antenna distance aft of the bow roller; 0 = no correction
  loa_m: 0                 # length overall, display only
  chain_size_mm: 12
  chain_onboard_m: 150
  # power_cat | power_mono | sail_cat | sail_mono
  hull_type: power_mono
  # catenary | ratio — method the Anchor Watch tile uses for the recommended rode
  scope_method: ratio
  windage_area_m2: 35

ui:
  # Provider names must match a plugin installed under <state dir>/plugins/.
  # The released plugin bundle ships: tides bom/noaa, weather
  # open-meteo/weatherkit, waves open-meteo-marine, poi osm-overpass/
  # google-places, warnings bom/nws.
  tide_provider: noaa
  tide_auto_station: true
  weather_provider: open-meteo
  wave_provider: open-meteo-marine
  # Points of interest (anchorages, marinas, fuel, moorings, etc.) for the
  # Nearby widget. osm-overpass needs no API key; google-places needs
  # GOOGLE_PLACES_API_KEY set via the secrets store.
  poi_provider: osm-overpass
  forecast_warnings_provider: nws
  # Optional. Unlike the others this one may be left out entirely: with no
  # upper-air plugin installed the forecast page simply shows no 500mb
  # section. It is separate from weather_provider because the two rarely come
  # from the same place - Apple WeatherKit makes a good surface forecast and
  # carries no pressure levels at all.
  upper_air_provider: open-meteo-upper
  # Optional friendly names for SignalK tank paths, e.g.
  # tank_labels:
  #   freshWater.0: PORT
  #   fuel.2: STBD

# Optional: long-term history from a SignalK InfluxDB v2 setup.
influxdb:
  enabled: false
  url: http://localhost:8086
  org: my-org
  bucket: SignalK_Data

# ARPA radar targets need no configuration here. They appear automatically
# when the mayara SignalK plugin (github.com/MarineYachtRadar/
# mayara-server-signalk-plugin) is installed on the SignalK server above and
# mayara-server itself is running against the radar. Helmcentral reads both
# through the SignalK connection it already has, the same way it reads every
# other sensor.
#
# The live radar picture overlay on the anchor watch map is different: the
# SignalK plugin proxies mayara's REST API but not its spoke stream (the
# 8192-spoke sweep a live picture needs), so the overlay talks to
# mayara-server directly and needs its address here. Leave it blank to leave
# the overlay off.
mayara:
  address: ""
  port: 6502

# Onboard assistant: an OpenRouter-backed chat that can look up places, wind
# forecasts and tides for the boat's own crew (ADR 0093). Off by default and
# BYOK - the key lives in the secrets store (OPENROUTER_API_KEY via
# Settings -> Assistant), never here. Every reply shows its own cost.
#
# assistant:
#   enabled: false
#   # Any OpenRouter model id that supports tool calling. Blank falls back to
#   # this default.
#   model: anthropic/claude-sonnet-4.5
#   # Operator standing notes, injected verbatim into every system prompt.
#   # This is where local knowledge that a general model would not know goes,
#   # e.g. which anchorage suits which tide or wind:
#   notes: |
#     Queenfish fish Hill Inlet on a rising tide.
#     Snorkel Blue Pearl Bay in the last 1-2h of flood up to high slack.
#   # Show a microphone button in the composer that transcribes speech to
#   # the question, using the browser's own speech recognition. Off by
#   # default; needs https or localhost (browsers refuse microphone access
#   # on plain http).
#   voice_input: false
#   # Read the "## Spoken summary" section of a voice question's reply aloud
#   # with the browser's speech synthesis. Off by default.
#   read_aloud: false
#   # Listen continuously for "Hey Mate" while the app is open and treat what
#   # follows as the question, instead of requiring a tap to start listening.
#   # Off by default: it costs battery and, in Chrome, streams continuously
#   # to Google.
#   wake_word: false
