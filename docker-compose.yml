services:
  helmcentral:
    image: ghcr.io/gterrill/helmcentral:latest
    container_name: helmcentral
    restart: unless-stopped
    ports:
      # Host 9091 → container 8080. Change the left-hand side to serve the
      # dashboard on a different port.
      - "9091:8080"
    environment:
      # settings.yaml is read *and rewritten* by the Settings UI, so it lives
      # inside the writable data volume rather than being bind-mounted
      # read-only from the host.
      SETTINGS_FILE: /app/data/settings.yaml
      # The Overpass server used for place names, Mate's place search and
      # the Nearby tile's osm-overpass plugin is that plugin's own setting
      # (Settings -> Widgets -> Nearby -> osm-overpass's gear icon), not an
      # env var (ADR 0100) - see docs/reference/configuration.md.
    volumes:
      # All persistent state: settings.yaml, the four SQLite stores, routes,
      # dashboard pages, plugin caches and uploaded charts. Created on first
      # run if absent — no file needs to exist before the first `up`.
      - ./backend-data:/app/data
      # Reference tide/weather/wave/warning/upper-air providers. Download
      # the plugin bundle from the releases page and unpack it here:
      #
      #   sudo mkdir -p plugins && curl -fsSL \
      #     https://github.com/gterrill/helmcentral/releases/latest/download/helmcentral-plugins.tar.gz \
      #     | sudo tar -xz -C plugins
      #
      # sudo on both halves: with it on mkdir alone, tar runs unprivileged
      # against the root-owned directory it just created (issue #7).
      #
      # Kept outside the image on purpose (ADR 0017) so a plugin can be added
      # or updated without rebuilding or repulling.
      - ./plugins:/app/plugins:ro
