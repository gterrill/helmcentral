version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - INFLUXDB_URL=http://influxdb:8086
      - SIGNALK_URL=http://signalk:3000
    depends_on:
      - influxdb
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  influxdb:
    image: influxdb:latest
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=helmcentral
    volumes:
      - influxdb-storage:/var/lib/influxdb2

volumes:
  influxdb-storage:
