services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"

  backend-dev:
    profiles: ["dev"]
    image: golang:1.22-alpine
    working_dir: /app
    command: sh -c "go mod tidy && go run main.go"
    env_file:
      - ./backend/.env
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/app

  frontend-dev:
    profiles: ["dev"]
    image: node:18-alpine
    working_dir: /app
    command: sh -c "[ -d node_modules ] && [ \"$(ls -A node_modules 2>/dev/null)\" ] || npm install; npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
