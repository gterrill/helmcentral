# Prose lint for the operator help pages (docs/features, how-to, reference
# and docs/index.md). Run with `make docs-lint`. ADRs and developer pages are
# the engineering record and are not checked.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[docs/{index.md,features/*.md,how-to/*.md,reference/*.md}]
BasedOnStyles = Helm
