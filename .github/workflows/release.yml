name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  # The release body is the tag's section of CHANGELOG.md. Extracted first so a
  # tag without written notes fails before anything is built or published.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract CHANGELOG section
        run: sh packaging/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  # The reference tide/weather/wave/warning providers are WASM, which is
  # architecture-independent — build them once and attach the bundle to the
  # release. The installer unpacks it into <state dir>/plugins, so consumers
  # need neither TinyGo nor a checkout of this repo.
  plugins:
    name: Build plugin bundle
    runs-on: ubuntu-latest
    needs: notes
    steps:
      - uses: actions/checkout@v7

      - name: Build with TinyGo
        run: |
          # The image has its own uid 1000, but the runner's workspace is owned
          # by uid 1001, so the container cannot create ./plugins inside the
          # bind mount (it is gitignored, so the checkout never provides it).
          # Run as the runner instead, with a writable HOME: once the uid is
          # overridden /home/tinygo is off-limits, and both `go mod download`
          # and TinyGo's build cache write under $HOME.
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src tinygo/tinygo:0.41.1 \
            sh packaging/build-plugins.sh docs/examples ./plugins

      - name: Package bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-plugins
          # Contents are the category dirs themselves (tides/, weather/, ...)
          # so the bundle untars straight into <state dir>/plugins. Name them
          # via the glob rather than `.` so the archive carries no entry for
          # the target directory itself: GNU tar tries to restore that entry's
          # mtime on extract and exits non-zero when the extracting user does
          # not own the directory (issue #7).
          (cd plugins && tar -czf "../dist-plugins/helmcentral-plugins-${version}.tar.gz" -- *)
          # Unversioned copy so the releases/latest/download URL in the docs
          # stays valid across releases. The installer still fetches the
          # versioned name from the tag it resolved.
          cp "dist-plugins/helmcentral-plugins-${version}.tar.gz" dist-plugins/helmcentral-plugins.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-bundle
          path: dist-plugins/
          retention-days: 1

  goreleaser:
    name: Binaries
    runs-on: ubuntu-latest
    needs: plugins
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Picked up by the release.extra_files glob in .goreleaser.yaml.
      - uses: actions/download-artifact@v8
        with:
          name: plugin-bundle
          path: dist-plugins

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          # Outside the checkout: GoReleaser refuses to release from a tree
          # with untracked files.
          path: ${{ runner.temp }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: notes
    steps:
      - uses: actions/checkout@v7

      # QEMU + buildx are what make the arm builds possible. Without them the
      # published image was amd64-only, which fails with "exec format error"
      # on every Raspberry Pi — the most common SignalK host there is.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
