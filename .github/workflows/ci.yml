name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older run. Each push to main gets a group of
# its own, so no run on main is cancelled or replaced while pending: each merge
# commit is the first build of that PR together with the ones merged before it,
# and a cancelled run would hide a broken main.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection requires most of the jobs below by name, so a docs-only
  # PR cannot skip them with a workflow-level paths-ignore: they would sit at
  # "Expected" forever. Every job still reports instead, and the expensive ones
  # are gated on `code`. A job skipped by its own `if` reports as skipped,
  # which branch protection counts as passed. Pushes to main run everything.
  # The gates test `code != 'false'` under `!cancelled()`, so a failed Changes
  # job leaves `code` empty and everything runs rather than skips.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit and its first parent, the current base.
          fetch-depth: 2

      # code=false only when every changed file is under docs/ (but not
      # docs/examples/, which holds plugin source), or is README.md or
      # CHANGELOG.md. AGENTS.md and the other root Markdown steer agents, so
      # they count as code. A failed diff fails the job rather than reading
      # as "docs only". --no-renames lists a file moved into docs/ under its
      # old path too.
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if echo "$files" | grep -qE '^docs/examples/' \
            || echo "$files" | grep -qvE '^(docs/|README\.md$|CHANGELOG\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # govulncheck reports only vulnerabilities on call paths this code
      # actually reaches, so it stays quiet enough to gate a merge - unlike a
      # blanket dependency scanner. The first audit (2026-09-19) found 23
      # reachable vulnerabilities that had accumulated silently because nothing
      # here scanned; this is what stops that happening again. The script
      # excuses named advisories only, each with its reason.
      - name: Vulnerability scan
        working-directory: backend
        run: sh ../scripts/govulncheck.sh

  # ~5,000 tests in one package, mostly run one after another, so one runner
  # is bound by count; scripts/go-test-shard.sh deals them across three.
  #
  # Matrix job, so its `if` never tests `code`: a skipped matrix job reports
  # under its unexpanded name ("Backend tests (${{ matrix.shard }}/3)"), which
  # matches no required check. The job runs and expands its name, and each step
  # is gated on `code` instead, so a docs-only PR gets "Backend tests (1/3)" as
  # success.
  backend-test:
    name: Backend tests (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}

      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # -short (inside the script) skips the live BOM FTP round-trips in
      # wasm_ftp_*_test.go. Those assert against a third-party server whose
      # files rotate, so they fail for reasons that have nothing to do with a
      # change under review; run them locally when touching the FTP fetch path.
      - name: Test
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        working-directory: backend
        run: sh ../scripts/go-test-shard.sh ${{ matrix.shard }} 3

  # One shuffled run of the whole suite, on pushes to main only. The shards
  # above run tests in file order, so a test that leaks process-wide state into
  # the next one can pass there and fail on another ordering. A random seed
  # must not turn an unrelated PR red, so a PR does not run it; `make
  # check-backend` runs the same shuffle before a PR, and a failure that gets
  # past it surfaces in main's CI run, which `ship` step 8 checks. The
  # seed is printed in the log ("-test.shuffle <seed>"); rerun with
  # -shuffle=<seed> to reproduce.
  backend-test-shuffled:
    name: Backend tests (shuffled)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        working-directory: backend
        run: go test -short -shuffle=on ./...

  # The boat's time zone comes from a position lookup whose index is built the
  # first time anything needs a zone (backend/boat_time.go). The boat runs on a
  # Raspberry Pi 5, so this builds it on a native arm64 runner and fails if the
  # build takes over 3 s or holds over 64 MB. It is skipped by -short above, and
  # it needs an arm64 runner; if the repository cannot use GitHub's hosted
  # arm64 runners, run the same command on the Pi itself before a release.
  zone-index-arm64:
    name: Zone index on arm64
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Zone index init time and heap
        working-directory: backend
        run: go test -count=1 -run TestZoneFinderInitStaysSmall -v .

  # The suite is ~500 files whose cost is almost all per-file setup, so it
  # splits cleanly across runners; on one 4-core runner it was the slowest
  # job. Lint and build run in the Frontend job alongside the shards.
  # Steps, not the job, are gated on `code`: see Backend tests above.
  frontend-test:
    name: Frontend tests (${{ matrix.shard }}/5)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        working-directory: frontend
        run: npm ci

      - name: Test
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        working-directory: frontend
        run: npm test -- --shard=${{ matrix.shard }}/5

  frontend:
    name: Frontend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Dependency correctness only, not dead-code hunting. Catches imports of
      # packages that resolve today purely because they are transitive deps
      # that npm happens to hoist, which is a build that breaks on someone
      # else's version bump. Run `npm run knip` locally for the full report;
      # its unused-export findings are advisory and not worth failing a build.
      - name: Dependency check
        working-directory: frontend
        run: npm run knip:deps

      # tsc + vite build; also the gate that catches a frontend that cannot be
      # embedded into the release binary.
      - name: Build
        working-directory: frontend
        run: npm run build

  docs:
    name: Help pages prose
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # See scripts/check-adr-numbers.sh.
      - name: ADR numbers are unique
        run: sh scripts/check-adr-numbers.sh

      # Pinned to the version `brew install vale` gave on 2026-10-25, and
      # checked against the release's published sha256 before it runs.
      - name: Install Vale
        run: |
          curl -fsSLo vale.tar.gz https://github.com/errata-ai/vale/releases/download/v3.25.1/vale_3.25.1_Linux_64-bit.tar.gz
          echo "4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182  vale.tar.gz" | sha256sum -c -
          sudo tar -xzf vale.tar.gz -C /usr/local/bin vale

      # Same checks as `make docs-lint`: the ADR number check above, then vale.
      # Only vale errors fail the job.
      - name: Lint
        run: vale --no-global docs

      # These tests read the help pages from disk: help links against the
      # docs' headings, the dashboard vocabulary, and the help tree Mate loads.
      # The test jobs run them when code changed; a docs-only PR runs them here.
      - uses: actions/setup-go@v7
        if: needs.changes.outputs.code == 'false'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Help tree loads
        if: needs.changes.outputs.code == 'false'
        working-directory: backend
        run: go test -short -run 'TestLoadHelp_RealDocsTree' .

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'false'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Docs-reading tests
        if: needs.changes.outputs.code == 'false'
        working-directory: frontend
        run: |
          npm ci
          npx vitest run src/test/help-links.test.ts src/test/docs-vocabulary.test.ts

  # actionlint through `go run` at the version pinned in the Makefile, so a
  # broken workflow fails here instead of when it first runs on main.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          # No cache: this job's module cache would otherwise claim the
          # backend jobs' cache key.
          cache: false

      - name: Lint workflows
        run: make workflow-lint

  # See scripts/check-changelog.sh. The push run catches a PR whose checks ran
  # before a release was tagged.
  changelog:
    name: Changelog released sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Check released sections
        run: sh scripts/check-changelog.sh

  # See scripts/check-commit-messages.sh. Pull requests only. The range ends at
  # the PR's own head commit: the checkout is GitHub's synthetic merge commit,
  # whose message is not the author's.
  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Claude attribution
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-commit-messages.sh "origin/${BASE_REF}..${HEAD_SHA}"

  # PRs build linux/amd64 only, unless they touch the release config,
  # dependencies, workflows or platform-specific Go (an OS/arch file suffix or
  # a //go:build line), when they build every published target. Pushes to main
  # always build every target. Plain Go can still break one target (a constant
  # that overflows 32-bit int on arm/v7, a unix-only syscall on windows); that
  # shows up on main after the merge rather than on the PR, but still before
  # the tag.
  release-targets:
    name: Release build targets
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit and its first parent, the current base.
          fetch-depth: 2

      - id: pick
        run: |
          all='[
            {"goos":"linux","goarch":"amd64"},
            {"goos":"linux","goarch":"arm64"},
            {"goos":"linux","goarch":"arm","goarm":"7"},
            {"goos":"darwin","goarch":"amd64"},
            {"goos":"darwin","goarch":"arm64"},
            {"goos":"windows","goarch":"amd64"}
          ]'
          matrix=$all
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Taken first so a failed diff fails the job instead of reading
            # as "nothing platform-specific changed".
            files=$(git diff --name-only HEAD^1 HEAD)
            tags=$(git diff HEAD^1 HEAD -- '*.go')
            if ! echo "$files" | grep -qE \
                '^(\.goreleaser\.yaml|backend/go\.(mod|sum)|frontend/package(-lock)?\.json|\.github/workflows/)|_(windows|darwin|linux|unix|arm|arm64|amd64)(_test)?\.go$' &&
              ! echo "$tags" | grep -qE '^[+-]//go:build'
            then
              matrix='[{"goos":"linux","goarch":"amd64"}]'
            fi
          fi
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  # One runner per target. Built together, the six compiles of the single
  # large main package queued on four cores and made this the slowest job by
  # minutes; --single-target builds only the GOOS/GOARCH/GOARM below, still
  # through .goreleaser.yaml and its frontend embed hooks.
  release-build:
    name: Release build (dry run, ${{ matrix.goos }}/${{ matrix.goarch }})
    needs: release-targets
    # release-targets runs after a failed Changes job, and so does this.
    if: ${{ !cancelled() && needs.release-targets.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Cross-compiles this target and runs the frontend embed hooks, so a
      # tag never fails on something a PR could have caught.
      - uses: goreleaser/goreleaser-action@v7
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target

  # The one release check branch protection requires. A PR builds only the
  # targets release-targets picks, so requiring each target by name would leave
  # most PRs waiting on checks that never report. always() keeps this reporting
  # when a job it needs fails, because a skipped check counts as passed. On a
  # docs-only PR both jobs are skipped on purpose, which passes here.
  release-builds:
    name: Release builds
    needs: [changes, release-targets, release-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          TARGETS: ${{ needs.release-targets.result }}
          BUILDS: ${{ needs.release-build.result }}
        run: |
          echo "Code changed: $CODE, release build targets: $TARGETS, release builds: $BUILDS"
          [ "$CODE" = false ] && exit 0
          [ "$TARGETS" = success ] && [ "$BUILDS" = success ]
