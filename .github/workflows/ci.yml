name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # govulncheck reports only vulnerabilities on call paths this code
      # actually reaches, so it stays quiet enough to gate a merge - unlike a
      # blanket dependency scanner. The first audit (2026-09-19) found 23
      # reachable vulnerabilities that had accumulated silently because nothing
      # here scanned; this is what stops that happening again.
      - name: Vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ~5,000 tests in one package, mostly run one after another, so one runner
  # is bound by count; scripts/go-test-shard.sh deals them across three.
  backend-test:
    name: Backend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # -short (inside the script) skips the live BOM FTP round-trips in
      # wasm_ftp_*_test.go. Those assert against a third-party server whose
      # files rotate, so they fail for reasons that have nothing to do with a
      # change under review; run them locally when touching the FTP fetch path.
      - name: Test
        working-directory: backend
        run: sh ../scripts/go-test-shard.sh ${{ matrix.shard }} 3

  # The boat's time zone comes from a position lookup whose index is built the
  # first time anything needs a zone (backend/boat_time.go). The boat runs on a
  # Raspberry Pi 5, so this builds it on a native arm64 runner and fails if the
  # build takes over 3 s or holds over 64 MB. It is skipped by -short above, and
  # it needs an arm64 runner; if the repository cannot use GitHub's hosted
  # arm64 runners, run the same command on the Pi itself before a release.
  zone-index-arm64:
    name: Zone index on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Zone index init time and heap
        working-directory: backend
        run: go test -count=1 -run TestZoneFinderInitStaysSmall -v .

  # The suite is ~500 files whose cost is almost all per-file setup, so it
  # splits cleanly across runners; on one 4-core runner it was the slowest
  # job. Lint and build run in the Frontend job alongside the shards.
  frontend-test:
    name: Frontend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test -- --shard=${{ matrix.shard }}/3

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Dependency correctness only, not dead-code hunting. Catches imports of
      # packages that resolve today purely because they are transitive deps
      # that npm happens to hoist, which is a build that breaks on someone
      # else's version bump. Run `npm run knip` locally for the full report;
      # its unused-export findings are advisory and not worth failing a build.
      - name: Dependency check
        working-directory: frontend
        run: npm run knip:deps

      # tsc + vite build; also the gate that catches a frontend that cannot be
      # embedded into the release binary.
      - name: Build
        working-directory: frontend
        run: npm run build

  docs:
    name: Help pages prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version `brew install vale` gave on 2026-10-25, and
      # checked against the release's published sha256 before it runs.
      - name: Install Vale
        run: |
          curl -fsSLo vale.tar.gz https://github.com/errata-ai/vale/releases/download/v3.25.1/vale_3.25.1_Linux_64-bit.tar.gz
          echo "4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182  vale.tar.gz" | sha256sum -c -
          sudo tar -xzf vale.tar.gz -C /usr/local/bin vale

      # Same command as `make docs-lint`. Only errors fail the job.
      - name: Lint
        run: vale --no-global docs

  # One runner per published target. Built together, the six compiles of the
  # single large main package queued on four cores and made this the slowest
  # job by minutes; --single-target builds only the GOOS/GOARCH/GOARM below,
  # still through .goreleaser.yaml and its frontend embed hooks.
  release-build:
    name: Release build (dry run, ${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Cross-compiles this target and runs the frontend embed hooks, so a
      # tag never fails on something a PR could have caught.
      - uses: goreleaser/goreleaser-action@v7
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target
