name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # govulncheck reports only vulnerabilities on call paths this code
      # actually reaches, so it stays quiet enough to gate a merge - unlike a
      # blanket dependency scanner. The first audit (2026-09-19) found 23
      # reachable vulnerabilities that had accumulated silently because nothing
      # here scanned; this is what stops that happening again.
      - name: Vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # -short skips the live BOM FTP round-trips in wasm_ftp_*_test.go. Those
      # assert against a third-party server whose files rotate, so they fail for
      # reasons that have nothing to do with a change under review; run them
      # locally when touching the FTP fetch path.
      - name: Test
        working-directory: backend
        run: go test -short ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Dependency correctness only, not dead-code hunting. Catches imports of
      # packages that resolve today purely because they are transitive deps
      # that npm happens to hoist, which is a build that breaks on someone
      # else's version bump. Run `npm run knip` locally for the full report;
      # its unused-export findings are advisory and not worth failing a build.
      - name: Dependency check
        working-directory: frontend
        run: npm run knip:deps

      - name: Test
        working-directory: frontend
        run: npm test

      # tsc + vite build; also the gate that catches a frontend that cannot be
      # embedded into the release binary.
      - name: Build
        working-directory: frontend
        run: npm run build

  release-build:
    name: Release build (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Cross-compiles every published target and runs the frontend embed
      # hooks, so a tag never fails on something a PR could have caught.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
